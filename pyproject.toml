[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-network-collector"
version = "2.0.0"
description = "Evidence-first public talent discovery and enrichment pipeline."
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
talent-collect = "talent_pipeline.cli:main"

[tool.setuptools]
packages = ["talent_pipeline", "app", "app.crawler", "app.enrichment", "app.extraction", "app.exports", "app.models", "app.resolution", "app.review"]
